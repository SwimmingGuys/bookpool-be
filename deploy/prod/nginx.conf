# 운영 진입점. TLS 종료 + 라우팅만 한다.
#   /api/*      → app:8080  (Spring Boot)
#   /actuator/* → 404       (메트릭·헬스가 외부에 열리지 않게 차단)
#   그 외        → web:80    (SPA 이미지 안의 nginx가 정적 파일 서빙)
#
# 인증서 경로에 도메인이 들어가지 않도록 certbot에 --cert-name bookpool 을 준다.
# 도메인이 바뀌어도 이 파일은 그대로다.

server {
    listen 80;
    server_name _;

    # certbot webroot 갱신용. 이 경로만 열어두고 나머지는 HTTPS로 보낸다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/bookpool/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookpool/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 업로드 이미지(최대 5MB)가 통과해야 한다. 기본값 1m으로는 413이 난다.
    client_max_body_size 10m;

    gzip on;
    gzip_proxied any;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ---- API ----
    # proxy_pass 끝에 / 를 붙이지 말 것: /api 프리픽스를 그대로 넘겨야 한다.
    # X-Forwarded-* 를 넘겨야 앱의 forward-headers-strategy: framework 가
    # https 로 인식하고 Secure 쿠키를 정상 처리한다.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- actuator 차단 ----
    # health,info,prometheus 가 노출 설정되어 있다. 헬스체크는 컨테이너 내부에서만
    # 돌면 되므로 외부에서는 막는다.
    location /actuator/ {
        return 404;
    }

    # ---- 업로드된 이미지 ----
    # 앱이 /uploads/** 로 서빙한다. 표지 이미지는 잘 바뀌지 않으므로 캐시를 길게.
    location /uploads/ {
        proxy_pass http://app:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # expires와 add_header를 같이 쓰면 Cache-Control이 두 번 붙는다. 하나로 둔다.
        add_header Cache-Control "public, max-age=2592000";
    }

    # ---- SPA ----
    # 정적 파일 서빙과 딥링크 폴백은 web 이미지 안의 nginx가 처리한다.
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
