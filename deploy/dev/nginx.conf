# 개발(=QA) 서버 nginx. 운영의 CloudFront 라우팅을 한 도메인에서 흉내낸다.
#   /api/*  → app:8080 프록시 (운영의 ALB origin 역할)
#   그 외   → SPA 정적 + 딥링크 fallback (운영의 S3 origin 역할)

# HTTP: ACME(certbot) 챌린지만 받고 나머지는 HTTPS로 리다이렉트
server {
    listen 80;
    server_name dev.bookpool.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dev.bookpool.co.kr;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 운영(CloudFront/ALB)이 심어주는 헤더를 nginx도 동일하게 전달
    # → 앱의 forward-headers-strategy: framework 가 https/secure 쿠키를 정확히 인식
    location /api/ {
        proxy_pass http://app:8080;        # 끝에 / 붙이지 말 것: /api 경로를 그대로 전달
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger(백엔드 springdoc) — basic auth 로 팀만 접근. 통과해야 app 으로 프록시된다.
    # /swagger-ui, /swagger-ui.html, /swagger-ui/* 와 /v3/api-docs* 를 모두 커버.
    location /swagger-ui {
        auth_basic           "Restricted - Swagger";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://app:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /v3/api-docs {
        auth_basic           "Restricted - Swagger";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://app:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 해시된 정적 자산: 장기 불변 캐시 (CloudFront 관례 흉내)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: 나머지는 index.html 로 폴백 (딥링크 새로고침 = CloudFront 에러응답 흉내)
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
