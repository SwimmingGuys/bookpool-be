# 개발(=QA) 서버: EC2 1대에 nginx + app + mysql + redis 를 올린다.
#   - 프론트는 nginx 가 정적 서빙(dist) → 운영의 S3 역할
#   - nginx 의 /api/* 프록시 → 운영의 ALB 역할
# 실행: deploy/dev 에서  docker compose up -d --build
services:
  mysql:
    image: mysql:8.4
    container_name: bookpool-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bookpool}
      MYSQL_USER: ${DB_DEV_USERNAME}
      MYSQL_PASSWORD: ${DB_DEV_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
      - --skip-name-resolve
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bookpool-net

  redis:
    image: redis:7-alpine
    container_name: bookpool-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - bookpool-net

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: bookpool-app:dev
    container_name: bookpool-dev-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8080"
    volumes:
      # 앱 시크릿(DB.DEV.* / JWT.SECRET / REDIS.* / MAIL.*)을 마운트로 주입.
      # application-dev.yml 의 spring.config.import: optional:file:/app/config/application-secret.yml
      - ./application-secret.yml:/app/config/application-secret.yml:ro
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - bookpool-net

  nginx:
    image: nginx:1.27-alpine
    container_name: bookpool-dev-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro       # 프론트 빌드 산출물(dist) = S3 대용
      - ./certs:/etc/nginx/certs:ro           # TLS 인증서 (certbot 발급분)
      - ./certbot-www:/var/www/certbot         # ACME challenge webroot
      - ./.htpasswd:/etc/nginx/.htpasswd:ro   # Swagger basic auth 계정
    depends_on:
      - app
    networks:
      - bookpool-net

volumes:
  mysql_data:
  redis_data:

networks:
  bookpool-net:
    driver: bridge