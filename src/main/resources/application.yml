spring:
  application:
    name: bookpool
  data:
    redis:
      host: ${REDIS.HOST:localhost}
      port: ${REDIS.PORT:6379}

# nginx/Caddy 등 리버스 프록시가 TLS를 종료할 때, 원 요청의 scheme/host(X-Forwarded-*)를
# 앱이 인식하도록 한다. (request.isSecure(), 리다이렉트 URL, Swagger 서버 URL 등이 https로 정확히 동작)
# 로컬은 프록시가 없어 forwarded 헤더가 없으므로 영향 없음.
server:
  forward-headers-strategy: framework

jwt:
  secret: ${JWT.SECRET}
  access-token-validity-ms: 3600000        # 1시간
  refresh-token-validity-ms: 1209600000    # 14일

app:
  # 운영/개발 서버는 same-origin(예: bookpool.co.kr + /api)이라 CORS가 사실상 불필요하지만,
  # 로컬 개발(localhost:5173 → :8080)은 포트가 달라 교차 오리진이므로 허용 목록이 필요하다.
  # 쿠키(자격 증명)를 주고받으므로 와일드카드 불가 → 오리진을 콤마로 명시.
  cors:
    allowed-origins: ${CORS.ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    # same-origin/same-site 구성이라 SameSite=Lax로 충분(None보다 안전, CSRF 방어에 유리).
    # Secure는 https 전제. 로컬(http)은 프로필에서 false로 override.
    cookie:
      secure: ${COOKIE.SECURE:true}
      same-site: ${COOKIE.SAME_SITE:Lax}
  # 회원가입 이메일 인증: 코드 유효 5분, 인증 완료 상태 유효 30분
  email-verification:
    code-ttl: 5m
    verified-ttl: 30m
  # 표지 이미지 업로드. 기본은 로컬 디스크에 저장하고 /uploads로 서빙한다.
  # 컨테이너 배포에서는 볼륨을 붙이거나 오브젝트 스토리지 구현으로 교체해야 한다.
  upload:
    directory: ${UPLOAD.DIRECTORY:uploads}
    public-path: /uploads
    max-size-bytes: 5242880

# Discord 알림: 4xx/5xx 에러 응답을 웹훅으로 전달한다.
# webhook-url은 민감 정보이므로 환경변수/secret으로 주입한다. alert.enabled는 환경별로 명시적으로 켠다.
discord:
  webhook-url: ${DISCORD.WEBHOOK_URL:}
  username: Bookpool Alert
  alert:
    enabled: ${DISCORD.ALERT_ENABLED:false}
    min-status: ${DISCORD.ALERT_MIN_STATUS:400}