spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB.PROD.URL}
    username: ${DB.PROD.USERNAME}
    password: ${DB.PROD.PASSWORD}
    driver-class-name: ${DB.PROD.DRIVER_CLASS_NAME}
  jpa:
    show-sql: false
    database: mysql
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
