spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB.PROD.URL}
    username: ${DB.PROD.USERNAME}
    password: ${DB.PROD.PASSWORD}
    driver-class-name: ${DB.PROD.DRIVER_CLASS_NAME}
  jpa:
    show-sql: false
    database: mysql
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
  # Redis: 컨테이너/외부 호스트를 환경변수로 주입 (기본값 없음 → 미설정 시 즉시 실패)
  data:
    redis:
      host: ${REDIS.HOST}
      port: ${REDIS.PORT:6379}
  # SMTP: 이메일 인증 코드 발송 (자격증명은 환경변수로 주입)
  mail:
    host: ${MAIL.HOST:smtp.gmail.com}
    port: ${MAIL.PORT:587}
    username: ${MAIL.USERNAME}
    password: ${MAIL.PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# 운영 서버: bookpool.co.kr + /api (same-origin). CORS는 실질적으로 사용되지 않지만 방어적으로 명시.
app:
  cors:
    allowed-origins: https://bookpool.co.kr
  auth:
    cookie:
      secure: true
      same-site: Lax
  mail:
    smtp:
      enabled: true
    from: ${MAIL.FROM:noreply@bookpool.co.kr}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
