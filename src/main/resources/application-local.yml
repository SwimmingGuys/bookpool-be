spring:
  # Local Config
  config:
    import:
      - application-secret.yml
    activate:
      on-profile: local
  # MySQL
  datasource:
    url: ${DB.LOCAL.URL}
    username: ${DB.LOCAL.USERNAME}
    password: ${DB.LOCAL.PASSWORD}
    driver-class-name: ${DB.LOCAL.DRIVER_CLASS_NAME}

  # JPA Config
  jpa:
    show-sql: false   # p6spy로 실제 쿼리를 출력하므로 중복 방지
    database: mysql
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

# p6spy: 바인딩된 실제 쿼리 로깅
decorator:
  datasource:
    p6spy:
      enable-logging: true
      logging: slf4j

swagger:
  server-url: ${SWAGGER.LOCAL.SERVER_URL}

# 로컬은 http이고 localhost:5173 <-> localhost:8080은 same-site이므로 Secure 불필요 + SameSite=Lax로 동작
app:
  auth:
    cookie:
      secure: false
      same-site: Lax