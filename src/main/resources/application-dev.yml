spring:
  # Dev Config
  config:
    import:
      - application-secret.yml
    activate:
      on-profile: dev
  # MySQL
  datasource:
    url: ${DB.DEV.URL}
    username: ${DB.DEV.USERNAME}
    password: ${DB.DEV.PASSWORD}
    driver-class-name: ${DB.DEV.DRIVER_CLASS_NAME}

  # JPA Config
  jpa:
    show-sql: false   # p6spy로 실제 쿼리를 출력하므로 중복 방지
    database: mysql
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

# p6spy: 바인딩된 실제 쿼리 로깅
decorator:
  datasource:
    p6spy:
      enable-logging: true
      logging: slf4j

# 개발 서버: dev.bookpool.co.kr + /api (same-origin). Redis host는 base의 ${REDIS.HOST}로 주입.
app:
  cors:
    allowed-origins: https://dev.bookpool.co.kr
  auth:
    cookie:
      secure: true        # dev가 https가 아닌 http면 false로 변경 (Secure 쿠키는 https에서만 전송됨)
      same-site: Lax