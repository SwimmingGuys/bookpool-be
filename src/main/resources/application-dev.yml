spring:
  # Dev Config
  config:
    import:
      - application-secret.yml
    activate:
      on-profile: dev
  # MySQL
  datasource:
    url: ${DB.DEV.URL}
    username: ${DB.DEV.USERNAME}
    password: ${DB.DEV.PASSWORD}
    driver-class-name: ${DB.DEV.DRIVER_CLASS_NAME}

  # JPA Config
  jpa:
    show-sql: true
    database: mysql
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true