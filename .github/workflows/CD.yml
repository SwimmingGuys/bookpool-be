name: Bookpool CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag (commit SHA)
        id: meta
        run: echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy deploy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/prod/docker-compose.yml,deploy/prod/nginx.conf,deploy/prod/backup-mysql.sh,deploy/prod/init-cert.sh,deploy/prod/renew-cert.sh"
          target: "/bookpool"
          strip_components: 2
          overwrite: true

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ENV_FILE,REGISTRY,IMAGE_NAME,IMAGE_TAG,GH_ACTOR,GH_TOKEN
          script: |
            set -e
            cd /bookpool

            # 1) GHCR 인증 (private 패키지면 필수)
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # 2) ENV_FILE secret 을 .env 로 기록 (앱 + MySQL 둘 다 사용)
            #    이전 파일이 있어도 덮어쓰기. 권한은 owner 만 읽기.
            umask 077
            printf '%s\n' "$ENV_FILE" > .env
            chmod 600 .env

            # 3) .env.images 에서 자기 키(APP_IMAGE_TAG)만 갈아끼운다.
            #    프론트 CD가 같은 파일의 WEB_IMAGE_TAG 를 쓰므로 서로 덮어쓰면 안 된다.
            touch .env.images
            grep -v '^APP_IMAGE_TAG=' .env.images > .env.images.tmp || true
            echo "APP_IMAGE_TAG=$IMAGE_TAG" >> .env.images.tmp
            mv .env.images.tmp .env.images
            chmod 600 .env.images

            # 4) .env(시크릿) + .env.images(이미지 태그) 를 모두 export 한 뒤 compose 실행
            set -a
            source .env
            source .env.images
            set +a

            chmod +x backup-mysql.sh init-cert.sh renew-cert.sh || true

            docker compose pull
            docker compose up -d

            # nginx.conf 는 마운트라 컨테이너 재생성 없이 reload 로 반영한다.
            # (인증서가 아직 없어 nginx가 안 떠 있는 최초 배포에서는 건너뛴다)
            docker exec bookpool-nginx nginx -s reload 2>/dev/null || true

            # 5) 헬스체크 대기 (최대 90초 — 최초 기동은 MySQL 초기화 포함)
            echo "Waiting for app to be healthy..."
            for i in $(seq 1 45); do
              status=$(docker inspect -f '{{.State.Health.Status}}' bookpool-app 2>/dev/null || echo "starting")
              if [ "$status" = "healthy" ]; then
                echo "App is healthy."
                break
              fi
              sleep 2
            done

            # 6) 정리
            docker image prune -f
            docker logout ghcr.io || true

      - name: Verify HTTPS
        run: |
          # DNS / Caddy / Let's Encrypt 정상 동작 확인
          # 첫 배포 시 인증서 발급에 시간 걸릴 수 있어 실패해도 워크플로우는 통과
          curl -fsSI --max-time 15 https://${{ secrets.EC2_HOST }} || echo "HTTPS not ready yet (first-time cert issuance can take a minute)"
